name: Release

on:
  push:
    tags: [v*]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: vectis-ubuntu
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check release version
        id: version
        run: |
          version=$(jq -r .version package.json)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag must match package.json: v$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.24.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm exec vitest run apps/cli/src/packaged.test.ts
      - run: pnpm package
      - run: node scripts/smoke-release.mjs dist-release
      - name: Smoke Linux x64 on the ARM64 Vectis guest
        run: |
          if [ "$(uname -m)" = aarch64 ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends qemu-user-binfmt libc6-amd64-cross libstdc++6-amd64-cross
            sudo systemctl restart systemd-binfmt
            INBOT_SMOKE_TARGET=linux-x64 INBOT_SMOKE_QEMU_PREFIX=/usr/x86_64-linux-gnu node scripts/smoke-release.mjs dist-release
          elif [ "$(uname -m)" != x86_64 ]; then
            echo "Unsupported Linux smoke architecture." >&2
            exit 1
          fi
      - run: pnpm test:packaging
        env:
          INBOT_TEST_RELEASE_DIR: dist-release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            dist-release/*.tar.gz
            dist-release/*.zip
            dist-release/SHA256SUMS
          if-no-files-found: error
          compression-level: 0

  smoke-macos:
    needs: package
    runs-on: vectis-macos-26-arm64
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist-release
      - run: node scripts/smoke-release.mjs dist-release

  smoke-windows:
    needs: package
    runs-on: vectis-windows-11-arm64
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          architecture: arm64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist-release
      - name: Smoke native Windows ARM64
        run: node scripts/smoke-release.mjs dist-release
        env:
          INBOT_SMOKE_TARGET: win32-arm64
      - name: Smoke Windows x64 under emulation
        run: node scripts/smoke-release.mjs dist-release
        env:
          INBOT_SMOKE_TARGET: win32-x64
      - name: Verify the PowerShell installer
        run: node --test scripts/install-windows.test.mjs scripts/release-checksum.test.mjs
        env:
          INBOT_TEST_RELEASE_DIR: dist-release

  draft-release:
    needs: [package, smoke-macos, smoke-windows]
    runs-on: vectis-ubuntu
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      - name: Refuse to modify a published release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: v${{ needs.package.outputs.version }}
        with:
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases, context.repo);
            if (releases.some(release => release.tag_name === process.env.RELEASE_TAG && !release.draft))
              throw new Error("This version is already published. Choose a new package version.");
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ needs.package.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Inbot ${{ needs.package.outputs.version }}
          draft: true
          fail_on_unmatched_files: true
          files: |
            release/*.tar.gz
            release/*.zip
            release/SHA256SUMS
