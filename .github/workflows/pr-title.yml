name: PR title

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: pr-title
    runs-on: vectis-ubuntu
    timeout-minutes: 5
    steps:
      # Reads only event data. Never check out or run code from the pull request here.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = context.payload.pull_request.title;
            const pattern = /^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: \S.*$/;
            if (!pattern.test(title))
              core.setFailed(
                `"${title}" is not a conventional commit title. Use for example "fix(inbound): keep envelopes until the store commits".`,
              );
